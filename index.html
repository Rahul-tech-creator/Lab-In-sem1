<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E commerce login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="auth-container">
        <form action="/products" id="form">
            <h2 id="form-title">Login</h2>
            <label for="user">Username
                <input type="text" name="username" id="user" placeholder="Enter username">
            </label><br><br>
            <label for="pass">Password
                <input type="password" name="Password" id="pass" placeholder="Enter Password">
            </label><br><br>
            <button type="submit" id="submit-btn">Submit</button>
            <p id="toggle-text">Don't have an account? <a href="#" id="toggle-link">Sign Up</a></p>
        </form>
    </div>

    <div id="app-container" style="display: none;">
        <div class="header-bar">
            <button id="logout-btn">Logout</button>
        </div>

        <div class="products">
            <div class="card">
                <h4>Mobile Phone</h4>
                <img src="https://images.unsplash.com/photo-1511707171634-5f897ff02aa9?w=400" alt="phone">
                <p>Iphone 16 pro 
                    <br>
                    89,000
                </p>
            </div>
            <div class="card">
                <h4>Laptop </h4>
                <img src="https://images.unsplash.com/photo-1517336714731-489689fd1ca8?w=400" alt="laptop">
                <p>Mac Book M1 
                    <br>
                    1,19,000
                </p>
            </div>
            <div class="card">
                <h4>Head Set</h4>
                <img src="https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=400" alt="headphone">
                <p>Sony HeadPhones 
                    <br>
                    21,000
                </p>
            </div>
            <div class="card">
                <h4>Mouse</h4>
                <img src="https://images.unsplash.com/photo-1527864550417-7fd91fc51a46?w=400" alt="mouse">
                <p>Zebroics 
                    <br>
                   1,200
                </p>
            </div>
        </div>

        <div class="banner">
            <h2>Biggest Sale</h2>
            <p>Grab the opertunities now</p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
